apiVersion: v1
kind: Service
metadata:
  name: traffic-backend
spec:
  selector:
    app: traffic-backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-frontend
spec:
  selector:
    app: traffic-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4173
  type: LoadBalancer
