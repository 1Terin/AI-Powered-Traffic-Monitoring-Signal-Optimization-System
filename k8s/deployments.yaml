apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-backend
  template:
    metadata:
      labels:
        app: traffic-backend
    spec:
      containers:
        - name: backend
          image: traffic-backend:latest
          ports:
            - containerPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-frontend
  template:
    metadata:
      labels:
        app: traffic-frontend
    spec:
      containers:
        - name: frontend
          image: traffic-frontend:latest
          ports:
            - containerPort: 4173
