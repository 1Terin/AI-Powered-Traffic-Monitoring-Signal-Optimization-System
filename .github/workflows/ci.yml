name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        run: |
          cd backend
          npm ci
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
      - name: Run backend lint/test (placeholder)
        run: |
          echo "No tests configured"
      - name: Build Docker images
        run: |
          docker build -f Dockerfile.backend -t traffic-backend:ci .
          docker build -f Dockerfile.frontend -t traffic-frontend:ci .
