name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements-inference.txt
          pip install pytest
      - name: Run Python tests
        run: python -m pytest -q

  node-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        run: |
          cd backend
          npm install
      - name: Install frontend deps
        run: |
          cd frontend
          npm install
      - name: Verify backend model loads
        run: node -e "require('./backend/src/models/TrafficEvent'); require('./backend/src/models/CameraDetection'); console.log('models ok')"
      - name: Build Docker images
        run: |
          docker build -f Dockerfile.backend -t traffic-backend:ci .
          docker build -f Dockerfile.frontend -t traffic-frontend:ci .
          docker build -f Dockerfile.inference -t traffic-inference:ci .
