services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: trafficdb
    volumes:
      - mongo_data:/data/db
    ports:
      - 27017:27017

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trafficdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  mqtt:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto/config:/mosquitto/config

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/trafficdb
      - MQTT_BROKER=mqtt://mqtt:1883
      - PORT=4000
      - INFERENCE_URL=http://inference:5001
      - SIMULATE_SENSORS=1
    ports:
      - 4000:4000
    depends_on:
      - mqtt
      - mongo
      - inference
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    ports:
      - 4173:4173
    depends_on:
      - backend
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    environment:
      - PORT=5001
    ports:
      - 5001:5001
    restart: unless-stopped

  yolo:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    environment:
      - MQTT_BROKER=mqtt://mqtt:1883
    depends_on:
      - mqtt
    restart: on-failure

  rl_trainer:
    build:
      context: .
      dockerfile: Dockerfile.rl
    environment:
      - MQTT_BROKER=mqtt://mqtt:1883
    depends_on:
      - backend
      - mqtt
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    depends_on:
      - prometheus

volumes:
  mongo_data:
  postgres_data:
  mosquitto_data:
  mosquitto_config:
