version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: trafficdb
    volumes:
      - mongo_data:/data/db
    ports:
      - 27017:27017

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/trafficdb
      - PORT=4000
    ports:
      - 4000:4000
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    ports:
      - 4173:4173
    depends_on:
      - backend

volumes:
  mongo_data:
